name: Skill End-to-End Tests (ovoscope)

on:
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

jobs:
  ovoscope:
    uses: OpenVoiceOS/gh-automations/.github/workflows/ovoscope.yml@dev
    secrets: inherit
    with:
      pre_install_pip: 'git+https://github.com/TigreGotico/mediavocab@feat/audit-2026-05-core git+https://github.com/TigreGotico/py-music-assistant@dev'
      python_version: '3.11'
      install_extras: 'test'
      test_path: 'test/end2end/'
